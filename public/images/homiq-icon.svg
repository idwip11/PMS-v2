<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 210" fill="none">
  <defs>
    <mask id="circle-gap">
      <!-- White reveals everything -->
      <rect width="210" height="210" fill="white" />
      <!-- Black cuts out around the tail (thicker stroke for gap) -->
      <path d="M 144.5 130 C 144.5 145 152 158 186 195" stroke="black" stroke-width="40" stroke-linecap="round" fill="none" />
    </mask>
  </defs>

  <!-- Outer Circle Ring with gap cutout -->
  <circle cx="105" cy="105" r="94" stroke="#09abe6" stroke-width="22" mask="url(#circle-gap)" />

  <!-- House Outline with Left Wall, Roof, and Tail -->
  <path d="M 65.5 163 L 65.5 82 L 105 44 L 144.5 82 L 144.5 136 C 144.5 150 152 161 186 195"
        stroke="#09abe6" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Inside Windows -->
  <rect x="91" y="95" width="28" height="20" rx="2" fill="#09abe6" />
  <rect x="91" y="128" width="28" height="20" rx="2" fill="#09abe6" />
</svg>